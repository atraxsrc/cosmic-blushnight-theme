"$schema" = "https://starship.rs/config-schema.json"
# BlushNight starship prompt, part of cosmic-blushnight-theme (MIT).
# Close to the defaults, coloured from the palette: secondary-text directory,
# branch in the yellow slot, the warning colour for a dirty tree, a success
# prompt character (the error colour after a failed command). Modules without a
# style here keep their defaults, which use the ANSI slots the COSMIC Terminal
# scheme already colours.

format = "$all"
palette = "blushnight"

[palettes.blushnight]
accent = "#CD7F8B"
warning = "#D48F5E"
success = "#AE9B84"
error = "#E8735E"
third = "#B09282"
secondary = "#9A958E"
faint = "#858079"
dim = "#66615A"
fg = "#DACCBC"

[character]
success_symbol = "[❯](bold success)"
error_symbol = "[❯](bold error)"
vimcmd_symbol = "[❮](bold third)"

[directory]
style = "bold secondary"
read_only_style = "error"
repo_root_style = "bold third"

[git_branch]
style = "bold third"

[git_commit]
style = "bold third"

[git_state]
style = "bold warning"

[git_status]
style = "warning"

[git_metrics]
added_style = "success"
deleted_style = "error"

[username]
style_user = "success"
style_root = "bold error"

[hostname]
style = "success"

[cmd_duration]
style = "faint"

[status]
style = "bold error"

[sudo]
style = "bold warning"

[jobs]
style = "warning"

[dart]
disabled = true

[time]
disabled = true
time_format = "%H:%M"
format = "[$time]($style)"
style = "dim"
