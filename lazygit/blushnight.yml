# BlushNight for lazygit, part of cosmic-blushnight-theme (MIT). Only the colours: your
# own ~/.config/lazygit/config.yml keeps the rest.
#
# Install: ./lazygit/install.sh puts this in ~/.config/lazygit/blushnight.yml and
# zsh/blushnight.zsh sets LG_CONFIG_FILE to "config.yml,blushnight.yml" so lazygit
# reads both (the later file wins). Without the zsh layer:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/blushnight.yml"
gui:
  theme:
    activeBorderColor:
      - "#CD7F8B"
      - bold
    inactiveBorderColor:
      - "#66615A"
    searchingActiveBorderColor:
      - "#D48F5E"
      - bold
    optionsTextColor:
      - "#9A958E"
    selectedLineBgColor:
      - "#312D28"
    inactiveViewSelectedLineBgColor:
      - "#25211D"
    cherryPickedCommitFgColor:
      - "#17130E"
    cherryPickedCommitBgColor:
      - "#B09282"
    markedBaseCommitFgColor:
      - "#17130E"
    markedBaseCommitBgColor:
      - "#AE9B84"
    unstagedChangesColor:
      - "#E8735E"
    defaultFgColor:
      - "#DACCBC"
  authorColors:
    "*": "#B09282"
