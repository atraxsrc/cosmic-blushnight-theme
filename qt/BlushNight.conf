# BlushNight colour scheme for qt5ct / qt6ct, part of cosmic-blushnight-theme (MIT).
# The rice's window colour for windows, its containers for buttons and
# tooltips, its text colour, the accent as highlight with the button text
# colour on it, dim placeholders.
#
# Install: ./qt/install.sh puts this in ~/.config/qt5ct/colors/ and
# ~/.config/qt6ct/colors/. Then in qt5ct / qt6ct: Appearance -> Color scheme
# -> BlushNight, Palette: Custom, Apply. Qt apps need QT_QPA_PLATFORMTHEME=qt5ct
# (or qt6ct) in the environment to read it.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#daccbc, #25211d, #66615a, #3f3b36, #17130e, #312d28, #daccbc, #e4d6c6, #daccbc, #17130e, #17130e, #17130e, #cd7f8b, #17130e, #cd7f8b, #d48f5e, #25211d, #17130e, #25211d, #daccbc, #858079
disabled_colors=#66615a, #25211d, #66615a, #3f3b36, #17130e, #312d28, #66615a, #9a958e, #66615a, #17130e, #17130e, #17130e, #66615a, #9a958e, #858079, #858079, #25211d, #17130e, #25211d, #daccbc, #66615a
inactive_colors=#daccbc, #25211d, #66615a, #3f3b36, #17130e, #312d28, #daccbc, #e4d6c6, #daccbc, #17130e, #17130e, #17130e, #cd7f8b, #17130e, #cd7f8b, #d48f5e, #25211d, #17130e, #25211d, #daccbc, #858079
